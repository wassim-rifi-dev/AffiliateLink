services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=affiliatelink_db'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:? Set DB_PASSWORD in .env}'
      - 'POSTGRES_USER=affiliate'
    ports:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
